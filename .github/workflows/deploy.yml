# This workflow will build and push a web application to an Azure Static Web App when you change your code.
#
# This workflow assumes you have already created the target Azure Static Web App.
# For instructions see https://docs.microsoft.com/azure/static-web-apps/get-started-portal?tabs=vanilla-javascript
#
# To configure this workflow:
#
# 1. Set up a secret in your repository named AZURE_STATIC_WEB_APPS_API_TOKEN with the value of your Static Web Apps deployment token.
#    For instructions on obtaining the deployment token see: https://docs.microsoft.com/azure/static-web-apps/deployment-token-management
#
# 3. Change the values for the APP_LOCATION, API_LOCATION and APP_ARTIFACT_LOCATION, AZURE_STATIC_WEB_APPS_API_TOKEN environment variables (below).
#    For instructions on setting up the appropriate configuration values go to https://docs.microsoft.com/azure/static-web-apps/front-end-frameworks
name: Deploy web app to Azure Static Web Apps

on:
  workflow_dispatch: 
  push:
    branches: [ "main" ]
    paths:
      - frontend/**

# Environment variables available to all jobs and steps in this workflow
env:
  APP_LOCATION: "frontend" # location of your client code
  API_LOCATION: "" # location of your api source code - optional
  OUTPUT_LOCATION: "/" # location of client code build output

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Verify Secret Presence
        run: |
          if [ -z "${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}" ]; then
            echo "ERROR: AZURE_STATIC_WEB_APPS_API_TOKEN is empty or unreadable!"
            exit 1
          else
            echo "Token secret verified."
          fi

      - name: Substitute Secrets into SWA Config
        env:
          FUNCTION_APP_URL: ${{ secrets.FUNCTION_URL }}
          FUNCTION_APP_KEY: ${{ secrets.MY_FUNCTION_KEY }}
        run: |
          envsubst '${FUNCTION_APP_URL} ${FUNCTION_APP_KEY}' < "$APP_LOCATION/staticwebapp.config.template.json" > "$APP_LOCATION/staticwebapp.config.json"
          
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "${{ env.APP_LOCATION }}"
          api_location: "${{ env.API_LOCATION }}"
          output_location: "${{ env.OUTPUT_LOCATION }}"

      
